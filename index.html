<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIM TRAINER · 练枪训练营</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070a0f}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #game{display:block;width:100%;height:100%;cursor:none}

  /* ---------- HUD ---------- */
  .hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
    padding:8px 18px;border-radius:12px;background:rgba(8,13,21,.72);backdrop-filter:blur(12px);
    border:1px solid rgba(80,180,255,.18);color:#dbe9f6;font-size:13px;z-index:10}
  .hud .it{display:flex;align-items:baseline;gap:5px}
  .hud b{color:#5ad1ff;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .hud .sep{width:1px;height:16px;background:rgba(110,170,210,.22)}
  .hud .wpn{color:#ffcf6b;font-weight:700;letter-spacing:1px}
  .hbtn{padding:5px 12px;font-size:12px;color:#9fc4dd;background:rgba(90,160,210,.1);
    border:1px solid rgba(120,180,220,.26);border-radius:999px;cursor:pointer;font-family:inherit;transition:.15s}
  .hbtn:hover{color:#5ad1ff;border-color:#5ad1ff}

  /* ---------- 遮罩 ---------- */
  .veil{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(14,24,40,.95),rgba(4,6,11,.985));
    color:#e8f4ff;text-align:center;padding:22px 26px;overflow-y:auto}
  .veil.hidden{display:none}
  h1{font-size:clamp(26px,3.8vw,44px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(94deg,#5ad1ff,#8b7cff 55%,#ff7a6b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11.5px;color:#6f8ba5;letter-spacing:6px;margin:2px 0 18px}

  .step{font-size:12px;color:#7f9bb5;letter-spacing:2px;margin:10px 0 8px;font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* 角色卡 */
  .ccard{width:104px;border-radius:12px;padding:8px 6px 9px;cursor:pointer;text-align:center;
    background:rgba(110,160,205,.055);border:1px solid rgba(110,175,215,.18);transition:.18s}
  .ccard:hover{border-color:rgba(120,205,245,.55);background:rgba(110,190,235,.1)}
  .ccard.on{border-color:#5ad1ff;background:rgba(90,209,255,.12);box-shadow:0 0 0 1px rgba(90,209,255,.35),0 6px 22px rgba(90,209,255,.16)}
  .ccard canvas{width:88px;height:96px;display:block;margin:0 auto 2px;border-radius:8px}
  .ccard .cn{font-size:13px;font-weight:800;color:#cfe6f6;letter-spacing:1px}
  .ccard.on .cn{color:#5ad1ff}
  .ccard .cd{font-size:10px;color:#7f9bb5;margin-top:2px;line-height:1.5}

  /* 武器卡 */
  .wcard{width:118px;border-radius:11px;padding:9px 8px;cursor:pointer;text-align:left;
    background:rgba(110,160,205,.055);border:1px solid rgba(110,175,215,.18);transition:.18s}
  .wcard:hover{border-color:rgba(255,207,107,.5)}
  .wcard.on{border-color:#ffcf6b;background:rgba(255,207,107,.1);box-shadow:0 0 0 1px rgba(255,207,107,.3)}
  .wcard .wn{font-size:13.5px;font-weight:800;color:#ffe3ac;letter-spacing:1px;margin-bottom:5px}
  .wcard .ws{font-size:10px;color:#8fa8bd;line-height:1.75;font-variant-numeric:tabular-nums}
  .wcard .ws span{color:#cfe0ee}

  /* 难度 */
  .dcard{width:96px;padding:9px 6px;border-radius:10px;cursor:pointer;text-align:center;
    background:rgba(110,160,205,.055);border:1px solid rgba(110,175,215,.18);transition:.18s}
  .dcard:hover{border-color:rgba(120,205,245,.5)}
  .dcard.on{border-color:#5ad1ff;background:rgba(90,209,255,.12)}
  .dcard .dn{font-size:13px;font-weight:800;color:#cfe6f6}
  .dcard.on .dn{color:#5ad1ff}
  .dcard .dd{font-size:9.5px;color:#7f9bb5;margin-top:3px;line-height:1.5}

  .btn{padding:13px 46px;font-size:16px;font-weight:800;letter-spacing:2px;color:#04121c;border:none;
    border-radius:999px;cursor:pointer;background:linear-gradient(92deg,#5ad1ff,#7ee0c0);
    box-shadow:0 8px 28px rgba(90,209,255,.3);transition:.15s;font-family:inherit;margin-top:20px}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(90,209,255,.44)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:#8fb8d8;border:1px solid rgba(120,180,220,.3);
    box-shadow:none;font-size:12.5px;padding:9px 22px;margin-top:10px;letter-spacing:1px}

  /* 结束统计 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px;width:min(560px,92vw)}
  .st{background:rgba(110,160,205,.06);border:1px solid rgba(110,175,215,.16);border-radius:10px;padding:10px 6px}
  .st .v{font-size:21px;font-weight:800;color:#5ad1ff;font-variant-numeric:tabular-nums}
  .st .k{font-size:10.5px;color:#7f9bb5;letter-spacing:.5px;margin-top:2px}
  #finalScore{font-size:64px;font-weight:900;line-height:1;
    background:linear-gradient(92deg,#5ad1ff,#8b7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lbl{font-size:11.5px;color:#7f9bb5;letter-spacing:3px;margin-top:4px}

  #pausedVeil{background:rgba(6,10,16,.84);backdrop-filter:blur(7px)}
  #pausedVeil h2{font-size:32px;font-weight:900;letter-spacing:6px;color:#cfe6f6;margin-bottom:8px}
  #pausedVeil .tip{font-size:12px;color:#7f9bb5;margin-bottom:20px;letter-spacing:1px}
  #pausedVeil .btns{display:flex;gap:12px}

  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#ffb3b3;
    background:rgba(58,12,18,.82);padding:8px 18px;border-radius:9px;z-index:30;display:none}
  .keys{position:fixed;bottom:12px;left:14px;font-size:10.5px;color:rgba(130,165,195,.42);letter-spacing:.6px;z-index:10}
  .credit{position:fixed;bottom:12px;right:196px;font-size:10.5px;color:rgba(130,165,195,.42);letter-spacing:1px;z-index:10}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <span class="it">时间 <b id="hTime">60</b></span>
  <span class="sep"></span>
  <span class="it">得分 <b id="hScore">0</b></span>
  <span class="sep"></span>
  <span class="it">命中率 <b id="hAcc">--</b></span>
  <span class="sep"></span>
  <span class="it">连击 <b id="hCombo">0</b></span>
  <span class="sep"></span>
  <span class="it wpn" id="hWpn">步枪</span>
  <span class="sep"></span>
  <button class="hbtn" id="pauseBtn">暂停</button>
  <button class="hbtn" id="endBtn">结束</button>
</div>

<!-- 开始 -->
<div class="veil" id="startVeil">
  <h1>AIM TRAINER</h1>
  <div class="sub">练 枪 训 练 营</div>

  <div class="step">① 选择角色</div>
  <div class="row" id="charRow"></div>

  <div class="step">② 选择武器</div>
  <div class="row" id="weaponRow"></div>

  <div class="step">③ 选择难度</div>
  <div class="row" id="diffRow"></div>

  <button class="btn" id="startBtn">开始训练</button>
</div>

<!-- 暂停 -->
<div class="veil hidden" id="pausedVeil">
  <h2>已暂停</h2>
  <div class="tip">按 P 或空格继续 · 按 Esc 结束本局</div>
  <div class="btns">
    <button class="btn" id="resumeBtn" style="margin-top:0">继续</button>
    <button class="btn ghost" id="quitBtn" style="margin-top:0">结束本局</button>
  </div>
</div>

<!-- 结束 -->
<div class="veil hidden" id="overVeil">
  <div class="lbl">本 轮 得 分</div>
  <div id="finalScore">0</div>
  <div class="stats">
    <div class="st"><div class="v" id="sAcc">0%</div><div class="k">命中率</div></div>
    <div class="st"><div class="v" id="sKill">0</div><div class="k">击杀</div></div>
    <div class="st"><div class="v" id="sHead">0%</div><div class="k">爆头率</div></div>
    <div class="st"><div class="v" id="sKps">0</div><div class="k">KPS</div></div>
  </div>
  <div style="font-size:11.5px;color:#7f9bb5;letter-spacing:1px" id="sMeta"></div>
  <button class="btn" id="againBtn">再来一局</button>
  <button class="btn ghost" id="backBtn">重新配置</button>
</div>

<div id="toast"></div>
<div class="keys">鼠标瞄准 · 左键射击 · R 换弹 · P 暂停 · Esc 结束</div>
<div class="credit">原生 Canvas · 零依赖 · 程序化角色与音效</div>

<script>
(function(){
"use strict";

// ==================== 常量与数据 ====================
const CHARS = {
  storm:{ key:"storm", name:"疾风", color:"#4fa8ff", desc:"射速 +12%", fireMul:1.12, recoilMul:1.00, reloadMul:1.00, headMul:1.00 },
  wall: { key:"wall",  name:"铁壁", color:"#ff8a3d", desc:"后坐力 -35%", fireMul:1.00, recoilMul:0.65, reloadMul:1.00, headMul:1.00 },
  ghost:{ key:"ghost", name:"幽灵", color:"#a56bff", desc:"换弹 -40%", fireMul:1.00, recoilMul:1.00, reloadMul:0.60, headMul:1.00 },
  hawk: { key:"hawk",  name:"鹰眼", color:"#3ddc84", desc:"爆头伤害 +60%", fireMul:1.00, recoilMul:1.00, reloadMul:1.00, headMul:1.60 }
};

const WEAPONS = {
  pistol:{ key:"pistol", name:"手枪", dmg:36, rpm:250, mag:12, spread:0.9,  reload:1300, auto:false, kick:1.6, color:"#8fd6ff" },
  rifle: { key:"rifle",  name:"步枪", dmg:26, rpm:560, mag:30, spread:1.5,  reload:2100, auto:true,  kick:1.0, color:"#ffcf6b" },
  smg:   { key:"smg",    name:"冲锋枪", dmg:17, rpm:860, mag:25, spread:2.4, reload:1700, auto:true,  kick:0.8, color:"#7ef0c0" },
  lmg:   { key:"lmg",    name:"重机枪", dmg:23, rpm:680, mag:60, spread:3.2, reload:3300, auto:true,  kick:1.5, color:"#ff8f8f" }
};

const DIFFS = {
  easy:  { key:"easy",  label:"简单", spawn:1.30, ttl:2.6, max:3 },
  normal:{ key:"normal",label:"普通", spawn:0.95, ttl:1.9, max:4 },
  hard:  { key:"hard",  label:"困难", spawn:0.65, ttl:1.35,max:6 }
};

let char = CHARS.storm, weapon = WEAPONS.rifle, diff = DIFFS.normal;

// ==================== 画布 ====================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = (id)=>document.getElementById(id);
let W=0,H=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize); resize();

// ==================== 状态 ====================
const S = { MENU:0, PLAY:1, PAUSED:2, OVER:3 };
let state = S.MENU, paused = false;

let score=0, combo=0, maxCombo=0, timeLeft=60;
let shots=0, hits=0, kills=0, headshots=0;
let lastTs=0, elapsed=0;

let ammo=30, reloading=false, reloadT=0, reloadTotal=0;
let fireCd=0, recoil=0, muzzle=0;

const pointer = { x: 0, y: 0 };
let targets = [];
let parts = [], texts = [], tracers = [];

// ==================== 工具 ====================
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ==================== 音效（WebAudio 合成） ====================
let actx=null;
function ensureAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
}
function noiseBurst(dur, cutoff, gain){
  if(!actx) return;
  const n = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1,n,actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const t = i/n;
    d[i] = (Math.random()*2-1) * Math.pow(1-t, 3.2);
  }
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff;
  const g = actx.createGain(); g.gain.value=gain;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start();
}
function tone(freq, dur, gain, type){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur+0.02);
}
function sfxShot(){
  const heavy = weapon.key==="lmg";
  noiseBurst(heavy?0.10:0.07, heavy?1300:2100, heavy?0.26:0.2);
  tone(heavy?90:130, 0.06, 0.12, "square");
}
function sfxHit(head){
  tone(head?1180:880, 0.05, 0.14, "triangle");
  if(head) tone(1560, 0.07, 0.1, "sine");
}
function sfxKill(){ tone(660,0.08,0.12,"sine"); tone(990,0.09,0.1,"sine"); }
function sfxReload(){ noiseBurst(0.05,900,0.1); setTimeout(()=>noiseBurst(0.05,700,0.12),110); }
function sfxEmpty(){ noiseBurst(0.03,1500,0.08); }

// ==================== 角色立绘（程序化） ====================
function drawPortrait(cv, key){
  const g = cv.getContext("2d");
  const w = cv.width, h = cv.height;
  g.clearRect(0,0,w,h);

  const bg = g.createLinearGradient(0,0,0,h);
  const c = CHARS[key].color;
  bg.addColorStop(0, hexA(c,0.30));
  bg.addColorStop(1, hexA(c,0.04));
  g.fillStyle = bg; g.fillRect(0,0,w,h);

  const cx = w/2;
  g.lineJoin="round"; g.lineCap="round";

  // 肩部
  g.fillStyle = "#1d2733";
  g.beginPath();
  g.moveTo(cx-42, h);
  g.quadraticCurveTo(cx-40, h-34, cx-18, h-40);
  g.lineTo(cx+18, h-40);
  g.quadraticCurveTo(cx+40, h-34, cx+42, h);
  g.closePath(); g.fill();
  g.strokeStyle = hexA(c,0.75); g.lineWidth=1.6; g.stroke();

  // 脖子
  g.fillStyle = "#2f3b4a"; g.fillRect(cx-9, h-52, 18, 16);

  const faceY = h-76, faceR = 23;

  if(key==="storm"){
    // 蓝发 + 护目镜
    g.fillStyle = "#22303f";
    g.beginPath(); g.arc(cx, faceY, faceR, 0, Math.PI*2); g.fill();
    g.fillStyle = "#f0c9a8";
    g.beginPath(); g.arc(cx, faceY+3, faceR-3.5, 0, Math.PI*2); g.fill();
    // 头发
    g.fillStyle = c;
    g.beginPath();
    g.arc(cx, faceY-3, faceR+1.5, Math.PI*1.03, Math.PI*1.97);
    g.fill();
    g.beginPath(); g.moveTo(cx-24,faceY-10); g.quadraticCurveTo(cx-30,faceY-30,cx-8,faceY-28);
    g.quadraticCurveTo(cx+2,faceY-24,cx-4,faceY-14); g.closePath(); g.fill();
    // 护目镜
    g.fillStyle = "#0e1826"; g.fillRect(cx-21, faceY-4, 42, 9);
    g.fillStyle = hexA("#5ad1ff",0.9); g.fillRect(cx-18, faceY-2.5, 15, 6);
    g.fillStyle = hexA("#5ad1ff",0.65); g.fillRect(cx+3, faceY-2.5, 15, 6);
    // 嘴
    g.strokeStyle="#b98a6d"; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx-5, faceY+13); g.lineTo(cx+5, faceY+13); g.stroke();
  } else if(key==="wall"){
    // 橙色头盔 + 方脸
    g.fillStyle = "#2a3441";
    g.beginPath();
    g.moveTo(cx-26, faceY+2); g.lineTo(cx-24, faceY-16);
    g.quadraticCurveTo(cx, faceY-40, cx+24, faceY-16);
    g.lineTo(cx+26, faceY+2);
    g.quadraticCurveTo(cx, faceY+26, cx-26, faceY+2);
    g.closePath(); g.fill();
    g.fillStyle = "#f2c9a6";
    g.beginPath();
    g.moveTo(cx-19, faceY+1); g.lineTo(cx-18, faceY-10);
    g.quadraticCurveTo(cx, faceY-26, cx+18, faceY-10);
    g.lineTo(cx+19, faceY+1);
    g.quadraticCurveTo(cx, faceY+22, cx-19, faceY+1);
    g.closePath(); g.fill();
    // 头盔
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(cx-27, faceY-4); g.quadraticCurveTo(cx, faceY-42, cx+27, faceY-4);
    g.lineTo(cx+27, faceY-9); g.quadraticCurveTo(cx, faceY-46, cx-27, faceY-9);
    g.closePath(); g.fill();
    // 眼
    g.fillStyle="#1b2430";
    g.fillRect(cx-14, faceY-1, 7, 3.4); g.fillRect(cx+7, faceY-1, 7, 3.4);
    g.strokeStyle="#a9755a"; g.lineWidth=1.8;
    g.beginPath(); g.moveTo(cx-6, faceY+12); g.lineTo(cx+6, faceY+12); g.stroke();
  } else if(key==="ghost"){
    // 紫色兜帽 + 面罩
    g.fillStyle = "#2b2440";
    g.beginPath(); g.arc(cx, faceY, faceR+3, 0, Math.PI*2); g.fill();
    g.fillStyle = "#e9c6a8";
    g.beginPath(); g.arc(cx, faceY+2, faceR-4, 0, Math.PI*2); g.fill();
    // 兜帽
    g.fillStyle = c;
    g.beginPath();
    g.moveTo(cx-27, faceY+10);
    g.quadraticCurveTo(cx-30, faceY-34, cx, faceY-36);
    g.quadraticCurveTo(cx+30, faceY-34, cx+27, faceY+10);
    g.quadraticCurveTo(cx+22, faceY-16, cx, faceY-18);
    g.quadraticCurveTo(cx-22, faceY-16, cx-27, faceY+10);
    g.closePath(); g.fill();
    // 面罩
    g.fillStyle = "#151a26";
    g.beginPath();
    g.moveTo(cx-19, faceY+1);
    g.quadraticCurveTo(cx, faceY+22, cx+19, faceY+1);
    g.lineTo(cx+16, faceY-2);
    g.quadraticCurveTo(cx, faceY+13, cx-16, faceY-2);
    g.closePath(); g.fill();
    // 眼
    g.fillStyle = hexA("#c9a8ff",0.95);
    g.beginPath(); g.arc(cx-9, faceY-6, 2.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(cx+9, faceY-6, 2.6, 0, Math.PI*2); g.fill();
  } else {
    // 鹰眼：绿色贝雷帽 + 单眼瞄准镜
    g.fillStyle = "#22303f";
    g.beginPath(); g.arc(cx, faceY, faceR, 0, Math.PI*2); g.fill();
    g.fillStyle = "#f0c9a8";
    g.beginPath(); g.arc(cx, faceY+3, faceR-3.5, 0, Math.PI*2); g.fill();
    // 贝雷帽
    g.fillStyle = c;
    g.beginPath();
    g.ellipse(cx-3, faceY-19, 25, 12, -0.16, 0, Math.PI*2); g.fill();
    g.fillStyle = hexA(c,0.6);
    g.beginPath(); g.arc(cx+16, faceY-26, 3.4, 0, Math.PI*2); g.fill();
    // 眼
    g.fillStyle = "#1b2430";
    g.beginPath(); g.arc(cx-10, faceY-1, 3, 0, Math.PI*2); g.fill();
    // 单眼瞄准镜
    g.strokeStyle = "#0f1722"; g.lineWidth=3;
    g.beginPath(); g.arc(cx+11, faceY-1, 7, 0, Math.PI*2); g.stroke();
    g.strokeStyle = hexA(c,0.95); g.lineWidth=1.6;
    g.beginPath(); g.arc(cx+11, faceY-1, 7, 0, Math.PI*2); g.stroke();
    g.fillStyle = hexA(c,0.3);
    g.beginPath(); g.arc(cx+11, faceY-1, 6, 0, Math.PI*2); g.fill();
    g.strokeStyle="#b98a6d"; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx-6, faceY+13); g.lineTo(cx+4, faceY+12); g.stroke();
  }

  // 底部名字条
  g.fillStyle = hexA(c,0.14);
  g.fillRect(0, h-16, w, 16);
}

function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

// ==================== 靶子 ====================
const TARGET_HP = 100;

function makeTarget(){
  const padX = 120, padTop = H*0.32, padBot = H*0.58;
  let x, y, tries = 0;
  do {
    x = rand(padX, W-padX);
    y = rand(padTop, padBot);
    tries++;
  } while (tries < 24 && targets.some(t => Math.hypot(t.x-x, t.y-y) < 150));
  const hue = rand(0, 360);
  return {
    x, y, hp: TARGET_HP, maxHp: TARGET_HP,
    ttl: diff.ttl, maxTtl: diff.ttl,
    hue, flash: 0, dead: false,
    bob: rand(0, Math.PI*2),
    scale: 1, born: elapsed
  };
}

// 人偶尺寸
const BODY = { w: 36, h: 48, offY: 14 };   // 相对 (x,y) 身体矩形
const HEADR = 15, HEAD_OFF = -34;           // 头

function targetHead(t){ return { x:t.x, y:t.y+HEAD_OFF, r:HEADR*1.12 }; }
function targetBody(t){ return { x:t.x-BODY.w/2, y:t.y-BODY.offY, w:BODY.w, h:BODY.h }; }

function hitTestTarget(t, px, py){
  const hd = targetHead(t);
  if(Math.hypot(px-hd.x, py-hd.y) <= hd.r) return "head";
  const b = targetBody(t);
  if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h) return "body";
  return null;
}

function drawTarget(t){
  const alive = clamp(t.ttl/t.maxTtl, 0, 1);
  const pop = Math.min(1, (elapsed-t.born)/0.14);
  const sc = (0.82 + 0.18*pop) * 1.32;

  ctx.save();
  ctx.translate(t.x, t.y + Math.sin(t.bob)*2);
  ctx.scale(sc, sc);

  const base = "hsl("+t.hue+",72%,58%)";
  const dark = "hsl("+t.hue+",66%,34%)";
  const light= "hsl("+t.hue+",86%,72%)";

  // 影子
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath(); ctx.ellipse(0, 46, 26, 7, 0, 0, Math.PI*2); ctx.fill();

  // 腿
  ctx.fillStyle = dark; ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth=1.4;
  roundRect(-13, 30, 10, 24, 4); ctx.fill(); ctx.stroke();
  roundRect(3, 30, 10, 24, 4); ctx.fill(); ctx.stroke();

  // 身体
  const bg = ctx.createLinearGradient(-BODY.w/2, -BODY.offY, BODY.w/2, BODY.offY+BODY.h);
  bg.addColorStop(0, base); bg.addColorStop(1, dark);
  ctx.fillStyle = bg;
  roundRect(-BODY.w/2, -BODY.offY, BODY.w, BODY.h, 9); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth=1.5; ctx.stroke();

  // 手臂
  ctx.fillStyle = dark;
  roundRect(-BODY.w/2-8, -BODY.offY+4, 8, 30, 4); ctx.fill();
  roundRect(BODY.w/2, -BODY.offY+4, 8, 30, 4); ctx.fill();

  // 头
  const headY = HEAD_OFF;
  const hg = ctx.createRadialGradient(-4, headY-4, 1, 0, headY, HEADR);
  hg.addColorStop(0, light); hg.addColorStop(1, base);
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, headY, HEADR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=1.5; ctx.stroke();

  // 眼睛（瞄准点）
  ctx.fillStyle = "#101820";
  ctx.beginPath(); ctx.arc(-5.2, headY-2, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.2, headY-2, 2.5, 0, Math.PI*2); ctx.fill();
  // 十字标记（提示爆头位）
  ctx.strokeStyle = hexA("#ffffff", 0.55); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, headY-HEADR-3); ctx.lineTo(0, headY-HEADR+2); ctx.stroke();

  // 命中闪白
  if(t.flash > 0){
    ctx.globalAlpha = Math.min(0.85, t.flash*3);
    ctx.fillStyle = "#fff";
    roundRect(-BODY.w/2, -BODY.offY, BODY.w, BODY.h+18, 9); ctx.fill();
    ctx.beginPath(); ctx.arc(0, headY, HEADR+1, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 血条
  if(t.hp < t.maxHp){
    const bw = 46, bx = t.x-bw/2, by = t.y + HEAD_OFF - HEADR - 12;
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(bx, by, bw, 3.6);
    const p = t.hp/t.maxHp;
    ctx.fillStyle = p>0.6?"#7ee0c0":p>0.3?"#ffcf6b":"#ff7a6b";
    ctx.fillRect(bx, by, bw*p, 3.6);
  }

  // 存活倒计时环
  ctx.strokeStyle = "rgba(255,255,255,"+(0.14+0.3*alive)+")";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(t.x, t.y+HEAD_OFF, HEADR+7, -Math.PI/2, -Math.PI/2 + Math.PI*2*alive);
  ctx.stroke();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ==================== 粒子 / 飘字 / 弹道 ====================
function spawnBurst(x,y,hue,n,power,head){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rand(60,300)*(power||1);
    const life = rand(.28,.7);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,
      size:rand(1.4,3.6),hue,sat:88,lig:head?86:70,drag:.90,grav:120});
  }
}
function addText(x,y,str,color,size){
  texts.push({x,y,str,color:color||"#fff",size:size||18,life:.85,max:.85,vy:-58});
}

// ==================== 射击 ====================
function fire(){
  if(state!==S.PLAY || paused) return;
  if(reloading) return;
  if(ammo<=0){ sfxEmpty(); startReload(); return; }

  const interval = 60000/(weapon.rpm*char.fireMul);
  if(fireCd>0) return;
  fireCd = interval;

  ammo--; shots++;
  muzzle = 1;
  sfxShot();

  // 弹着点 = 准星 + 扩散 + 后坐力抖动
  const spreadPx = weapon.spread*4 + recoil*10;
  const ang = Math.random()*Math.PI*2;
  const rr = Math.random()*spreadPx;
  const px = pointer.x + Math.cos(ang)*rr;
  const py = pointer.y + Math.sin(ang)*rr;

  recoil = Math.min(3.2, recoil + weapon.kick*0.55);

  // 弹道
  tracers.push({ x1: W*0.5, y1: H+20, x2: px, y2: py, life:.07, max:.07 });

  // 命中判定（取最近的可命中靶）
  let best=null, bestZone=null, bestD=1e9;
  for(const t of targets){
    if(t.dead) continue;
    const z = hitTestTarget(t, px, py);
    if(z){
      const d = Math.hypot(px-t.x, py-(t.y+HEAD_OFF));
      if(d<bestD){ bestD=d; best=t; bestZone=z; }
    }
  }

  if(best){
    hits++;
    const isHead = bestZone==="head";
    let dmg = weapon.dmg * (isHead ? 2*char.headMul : 1);
    best.hp -= dmg;
    best.flash = 1;

    if(isHead) headshots++;
    spawnBurst(px, py, isHead?50:best.hue, isHead?16:8, isHead?1.15:.8, isHead);
    addText(px, py-14, "-"+Math.round(dmg), isHead?"#ffd75e":"#ffffff", isHead?20:15);
    sfxHit(isHead);

    if(best.hp<=0){
      best.dead = true;
      kills++; combo++;
      if(combo>maxCombo) maxCombo=combo;
      const gain = Math.round((isHead?150:100) * (1 + Math.min(combo-1,10)*0.06));
      score += gain;
      spawnBurst(best.x, best.y+HEAD_OFF, best.hue, 24, 1.25, false);
      addText(best.x, best.y-46, "+"+gain, "#7ee0c0", 21);
      sfxKill();
      targets = targets.filter(t=>t!==best);
    }
  } else {
    // 打空，断连击
    if(combo>0){ combo=0; }
    spawnBurst(px, py, 210, 3, .4, false);
  }

  if(ammo<=0) startReload();
  updateHUD();
}

function startReload(){
  if(reloading || ammo===weapon.mag) return;
  reloading = true;
  reloadTotal = weapon.reload*char.reloadMul;
  reloadT = reloadTotal;
  sfxReload();
}

// ==================== 靶场背景 ====================
function drawRange(){
  // 天空/墙
  const g = ctx.createLinearGradient(0,0,0,H*0.72);
  g.addColorStop(0,"#0b1622");
  g.addColorStop(0.55,"#0d1a28");
  g.addColorStop(1,"#101d2c");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const hz = H*0.62;

  // 环境光
  const lg = ctx.createRadialGradient(W*0.5, H*0.15, 40, W*0.5, H*0.15, W*0.72);
  lg.addColorStop(0,"rgba(90,180,255,.10)");
  lg.addColorStop(1,"rgba(90,180,255,0)");
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,hz);

  // 地面透视网格
  ctx.strokeStyle="rgba(90,170,225,.10)"; ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){
    const x = W*0.5 + i*(W*0.11);
    ctx.beginPath(); ctx.moveTo(W*0.5 + i*(W*0.02), hz); ctx.lineTo(x, H); ctx.stroke();
  }
  const rows = 9;
  for(let i=1;i<=rows;i++){
    const t = i/rows;
    const y = hz + (H-hz)*Math.pow(t,1.9);
    ctx.strokeStyle = "rgba(90,170,225,"+(0.075*(1-t*0.55)).toFixed(3)+")";
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // 地平线光带
  ctx.fillStyle="rgba(90,200,255,.14)"; ctx.fillRect(0,hz-1,W,1.6);

  // 远处靶板轮廓
  ctx.fillStyle="rgba(18,30,44,.85)";
  for(let i=0;i<5;i++){
    const bw=68, bh=90, gap=W/5.6, x=W*0.5+(i-2)*gap-bw/2, y=hz-bh-6;
    roundRect(x,y,bw,bh,6); ctx.fill();
    ctx.strokeStyle="rgba(90,180,235,.14)"; ctx.lineWidth=1; ctx.stroke();
  }

  // 暗角
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

// ==================== 准星 ====================
function drawCrosshair(){
  const x = pointer.x, y = pointer.y;
  const spread = weapon.spread*2.6 + recoil*7;

  ctx.save();
  ctx.strokeStyle = "rgba(126,240,192,.92)";
  ctx.lineWidth = 1.8;
  const gap = 4 + spread, len = 9;
  ctx.beginPath();
  ctx.moveTo(x-gap-len, y); ctx.lineTo(x-gap, y);
  ctx.moveTo(x+gap, y);     ctx.lineTo(x+gap+len, y);
  ctx.moveTo(x, y-gap-len); ctx.lineTo(x, y-gap);
  ctx.moveTo(x, y+gap);     ctx.lineTo(x, y+gap+len);
  ctx.stroke();

  ctx.strokeStyle="rgba(126,240,192,.5)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y,gap+len+3,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle="rgba(126,240,192,.95)";
  ctx.beginPath(); ctx.arc(x,y,1.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ==================== 枪械视图 ====================
function drawGun(){
  const bob = Math.sin(elapsed*6)*2;
  const recoilY = muzzle*10;
  const baseX = W*0.5, baseY = H - 2 - recoilY;

  ctx.save();
  ctx.translate(baseX, baseY);
  const c = weapon.color;

  // 枪身（带金属渐变）
  const gg = ctx.createLinearGradient(-20, -150, 20, 0);
  gg.addColorStop(0, "#2a3a4c");
  gg.addColorStop(0.45, "#1a2634");
  gg.addColorStop(1, "#0e161f");
  ctx.fillStyle=gg;
  roundRect(-20, -152+bob, 40, 154, 7); ctx.fill();
  ctx.strokeStyle=hexA(c,.5); ctx.lineWidth=1.6; ctx.stroke();
  // 高光条
  ctx.fillStyle="rgba(180,220,255,.10)";
  roundRect(-15, -146+bob, 6, 140, 3); ctx.fill();

  // 枪管
  ctx.fillStyle="#0d141c";
  roundRect(-9, -212+bob, 18, 64, 4); ctx.fill();
  ctx.strokeStyle=hexA(c,.34); ctx.lineWidth=1.2; ctx.stroke();
  // 枪口环
  ctx.strokeStyle=hexA(c,.6); ctx.lineWidth=2;
  roundRect(-11, -216+bob, 22, 8, 3); ctx.stroke();

  // 弹匣
  ctx.fillStyle="#1f2c3b";
  roundRect(-15, -92+bob, 30, 48, 5); ctx.fill();
  ctx.strokeStyle=hexA(c,.28); ctx.lineWidth=1; ctx.stroke();

  // 握把
  ctx.fillStyle="#0f1822";
  roundRect(-14, -30+bob, 28, 36, 6); ctx.fill();

  // 枪口火焰
  if(muzzle>0.02){
    const fy = -216+bob;
    const fg = ctx.createRadialGradient(0,fy,0,0,fy,40*muzzle);
    fg.addColorStop(0,"rgba(255,240,180,"+(0.95*muzzle)+")");
    fg.addColorStop(0.45,"rgba(255,170,60,"+(0.6*muzzle)+")");
    fg.addColorStop(1,"rgba(255,120,40,0)");
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.arc(0,fy,40*muzzle,0,Math.PI*2); ctx.fill();
    // 星芒
    ctx.strokeStyle="rgba(255,238,190,"+(0.8*muzzle)+")"; ctx.lineWidth=2.4;
    for(let i=0;i<6;i++){
      const a = (Math.PI*2/6)*i + muzzle*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*8, fy+Math.sin(a)*8);
      ctx.lineTo(Math.cos(a)*(26+18*muzzle), fy+Math.sin(a)*(26+18*muzzle));
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ==================== 绘制主循环 ====================
function draw(dt){
  drawRange();

  if(state===S.PLAY || state===S.PAUSED){
    for(const t of targets) drawTarget(t);
  }

  // 粒子
  for(const p of parts){
    const t = Math.max(0,p.life/p.max);
    ctx.fillStyle = "hsla("+p.hue+","+p.sat+"%,"+p.lig+"%,"+(t*0.95)+")";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*t,0,Math.PI*2); ctx.fill();
  }
  // 弹道
  for(const tc of tracers){
    const a = tc.life/tc.max;
    ctx.strokeStyle = "rgba(255,235,170,"+(a*0.55)+")";
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(tc.x1,tc.y1); ctx.lineTo(tc.x2,tc.y2); ctx.stroke();
  }
  // 飘字
  for(const t of texts){
    const a = t.life/t.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = t.color;
    ctx.font = "800 "+t.size+"px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText(t.str, t.x, t.y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign="left";

  if(state===S.PLAY || state===S.PAUSED){
    drawGun();
    drawCrosshair();
    drawAmmoPanel(dt);
  }
}

function drawAmmoPanel(){
  const px = W-176, py = H-62, pw = 158, ph = 44;
  ctx.fillStyle="rgba(8,13,21,.7)";
  roundRect(px,py,pw,ph,9); ctx.fill();
  ctx.strokeStyle="rgba(110,175,215,.22)"; ctx.lineWidth=1; ctx.stroke();

  ctx.fillStyle = weapon.color;
  ctx.font = "800 26px 'Microsoft YaHei',sans-serif";
  ctx.textAlign="right";
  const txt = ammo + " / " + weapon.mag;
  ctx.fillText(txt, px+pw-12, py+30);
  ctx.textAlign="left";

  ctx.fillStyle="rgba(150,180,205,.75)";
  ctx.font="600 10.5px 'Microsoft YaHei',sans-serif";
  ctx.fillText("弹药", px+12, py+18);

  // 弹匣格
  const n = weapon.mag, cols = Math.min(n, 20), cw = (pw-24)/cols;
  for(let i=0;i<cols;i++){
    const filled = i < Math.ceil(ammo/weapon.mag*cols);
    ctx.fillStyle = filled ? hexA(weapon.color,.9) : "rgba(120,150,175,.18)";
    ctx.fillRect(px+12+i*cw, py+ph-11, Math.max(1.6,cw-1.6), 5);
  }

  // 换弹进度
  if(reloading){
    const p = 1 - reloadT/reloadTotal;
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(px, py-14, pw, 6);
    ctx.fillStyle="#ffcf6b"; ctx.fillRect(px, py-14, pw*p, 6);
    ctx.fillStyle="#ffcf6b"; ctx.font="700 10.5px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("换弹中…", px+pw/2, py-18);
    ctx.textAlign="left";
  } else if(ammo<=weapon.mag*0.25){
    ctx.fillStyle="#ff9c6b"; ctx.font="700 10.5px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("按 R 换弹", px+pw/2, py-18);
    ctx.textAlign="left";
  }
}

// ==================== 更新 ====================
let spawnTimer = 0;

function update(dt){
  elapsed += dt;
  timeLeft -= dt;
  if(timeLeft<=0){ timeLeft=0; endGame(); return; }

  if(fireCd>0) fireCd -= dt*1000;
  if(muzzle>0) muzzle = Math.max(0, muzzle - dt*9);
  recoil = Math.max(0, recoil - dt*4.2);

  // 换弹
  if(reloading){
    reloadT -= dt*1000;
    if(reloadT<=0){ reloading=false; ammo=weapon.mag; updateHUD(); }
  }

  // 自动射击
  if(mouseDown && (weapon.auto || !firedOnce)){
    fire();
    if(!weapon.auto) firedOnce = true;
  }

  // 靶子
  spawnTimer -= dt;
  if(spawnTimer<=0 && targets.length < diff.max){
    targets.push(makeTarget());
    spawnTimer = diff.spawn * rand(0.75,1.25);
  }

  for(let i=targets.length-1;i>=0;i--){
    const t = targets[i];
    t.ttl -= dt;
    t.flash = Math.max(0, t.flash - dt*6);
    t.bob += dt*3.2;
    if(t.ttl<=0){ targets.splice(i,1); combo=0; updateHUD(); }
  }

  // 粒子
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.grav||0)*dt;
    const d=Math.pow(p.drag||.9, dt*60); p.vx*=d; p.vy*=d;
  }
  // 飘字
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.life-=dt;
    if(t.life<=0){ texts.splice(i,1); continue; }
    t.y += t.vy*dt; t.vy *= 0.94;
  }
  // 弹道
  for(let i=tracers.length-1;i>=0;i--){
    tracers[i].life-=dt;
    if(tracers[i].life<=0) tracers.splice(i,1);
  }

  updateHUD();
}

let mouseDown=false, firedOnce=false;

function updateHUD(){
  $("hTime").textContent = Math.ceil(timeLeft);
  $("hScore").textContent = score;
  $("hAcc").textContent = shots? Math.round(hits/shots*100)+"%" : "--";
  $("hCombo").textContent = combo;
  $("hWpn").textContent = weapon.name;
}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTs) lastTs=ts;
  let dt=(ts-lastTs)/1000; lastTs=ts;
  if(dt>0.05) dt=0.05;

  if(state===S.PLAY && !paused) update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== 流程 ====================
function startGame(){
  ensureAudio();
  score=0;combo=0;maxCombo=0;timeLeft=60;
  shots=0;hits=0;kills=0;headshots=0;
  elapsed=0; spawnTimer=0;
  targets=[]; for(let i=0;i<diff.max;i++) targets.push(makeTarget());
  parts=[]; texts=[]; tracers=[];
  ammo=weapon.mag; reloading=false; reloadT=0; reloadTotal=0;
  fireCd=0; recoil=0; muzzle=0; mouseDown=false; firedOnce=false;
  state=S.PLAY; paused=false;
  $("startVeil").classList.add("hidden");
  $("overVeil").classList.add("hidden");
  $("pausedVeil").classList.add("hidden");
  $("pauseBtn").textContent="暂停";
  updateHUD();
}

function togglePause(){
  if(state!==S.PLAY) return;
  paused=!paused;
  $("pausedVeil").classList.toggle("hidden", !paused);
  $("pauseBtn").textContent = paused? "继续":"暂停";
}

function endGame(){
  state=S.OVER; paused=false;
  $("pausedVeil").classList.add("hidden");
  $("pauseBtn").textContent="暂停";

  const acc = shots? Math.round(hits/shots*100):0;
  const hsRate = hits? Math.round(headshots/hits*100):0;
  const kps = (60/Math.max(1,(60-Math.max(0,timeLeft)))).toFixed(2);

  $("finalScore").textContent = score;
  $("sAcc").textContent = acc+"%";
  $("sKill").textContent = kills;
  $("sHead").textContent = hsRate+"%";
  $("sKps").textContent = (kills/Math.max(1, 60-timeLeft)).toFixed(2);
  $("sMeta").textContent = char.name + " · " + weapon.name + " · " + diff.label +
    " · 最高连击 " + maxCombo + " · 命中 " + hits + "/" + shots;
  $("overVeil").classList.remove("hidden");
}

// ==================== UI 构建 ====================
function buildCharCards(){
  const row = $("charRow");
  Object.keys(CHARS).forEach(k=>{
    const c = CHARS[k];
    const el = document.createElement("div");
    el.className = "ccard" + (k===char.key?" on":"");
    el.dataset.key = k;

    const cv = document.createElement("canvas");
    cv.width = 176; cv.height = 192;
    el.appendChild(cv);

    const nm = document.createElement("div"); nm.className="cn"; nm.textContent=c.name; el.appendChild(nm);
    const ds = document.createElement("div"); ds.className="cd"; ds.textContent=c.desc; el.appendChild(ds);

    el.addEventListener("click", ()=>{
      char = c;
      row.querySelectorAll(".ccard").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
    });
    row.appendChild(el);
    drawPortrait(cv, k);
  });
}

function buildWeaponCards(){
  const row = $("weaponRow");
  Object.keys(WEAPONS).forEach(k=>{
    const w = WEAPONS[k];
    const el = document.createElement("div");
    el.className = "wcard" + (k===weapon.key?" on":"");
    el.dataset.key = k;
    el.innerHTML =
      '<div class="wn" style="color:'+w.color+'">'+w.name+'</div>'+
      '<div class="ws">伤害 <span>'+w.dmg+'</span><br>'+
      '射速 <span>'+Math.round(w.rpm/60*10)/10+'/s</span><br>'+
      '弹匣 <span>'+w.mag+'</span> · '+(w.auto?'连发':'单发')+'</div>';
    el.addEventListener("click", ()=>{
      weapon = w;
      row.querySelectorAll(".wcard").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
    });
    row.appendChild(el);
  });
}

function buildDiffCards(){
  const row = $("diffRow");
  Object.keys(DIFFS).forEach(k=>{
    const d = DIFFS[k];
    const el = document.createElement("div");
    el.className = "dcard" + (k===diff.key?" on":"");
    el.innerHTML = '<div class="dn">'+d.label+'</div><div class="dd">刷新 '+d.spawn.toFixed(2)+'s<br>存活 '+d.ttl.toFixed(1)+'s</div>';
    el.addEventListener("click", ()=>{
      diff = d;
      row.querySelectorAll(".dcard").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
    });
    row.appendChild(el);
  });
}

buildCharCards();
buildWeaponCards();
buildDiffCards();

// ==================== 事件 ====================
canvas.addEventListener("mousemove", e=>{ pointer.x=e.clientX; pointer.y=e.clientY; });
canvas.addEventListener("touchmove", e=>{
  const t=e.touches[0]; if(t){ pointer.x=t.clientX; pointer.y=t.clientY; }
},{passive:true});

canvas.addEventListener("mousedown", e=>{
  if(e.button!==0) return;
  ensureAudio();
  mouseDown=true; firedOnce=false;
  if(state===S.PLAY) fire();
});
window.addEventListener("mouseup", ()=>{ mouseDown=false; firedOnce=false; });

window.addEventListener("keydown", e=>{
  const k=e.key.toLowerCase();
  if(k==="r"){ if(state===S.PLAY) startReload(); }
  else if(k==="p"||e.code==="Space"){ if(state===S.PLAY){ e.preventDefault(); togglePause(); } }
  else if(e.key==="Escape"){ if(state===S.PLAY) endGame(); }
});

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("backBtn").addEventListener("click", ()=>{
  state=S.MENU;
  $("overVeil").classList.add("hidden");
  $("startVeil").classList.remove("hidden");
});
$("pauseBtn").addEventListener("click", togglePause);
$("endBtn").addEventListener("click", ()=>{ if(state===S.PLAY) endGame(); });
$("resumeBtn").addEventListener("click", togglePause);
$("quitBtn").addEventListener("click", endGame);

})();
</script>
</body>
</html>
